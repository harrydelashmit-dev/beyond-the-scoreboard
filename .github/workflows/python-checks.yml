name: Python analysis checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python run_project.py --from-processed --test
      - run: python run_project.py --expanded --report-only
      - run: python run_project.py --returns --report-only
      - run: python -m scoreboard.presentation_charts
